# cnb.cool 云原生构建：把代码推到 cnb.cool 仓库时，自动构建镜像到 docker.cnb.cool
# 若已用 GitHub Actions 把镜像推到 docker.cnb.cool，此文件可省略（避免重复构建）。
# 镜像地址 = docker.cnb.cool/<组织>/<仓库名小写> = docker.cnb.cool/wuenciteam/ysp-live-docker
main:
  push:
    - services:
        - docker
      stages:
        - name: docker build
          script: docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest ./ysp-live-docker-v9.5-G
        - name: docker push
          script: docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
