name: sync-from-dockerhub

# 目标：每次更新 Docker Hub，把镜像（全部 tag）自动镜像到 GitHub(ghcr) 与 CNB。
# 触发：
#   1) 手动：Actions → sync-from-dockerhub → Run workflow
#   2) 自动：Docker Hub webhook → repository_dispatch（见 SYNC.md）
on:
  # 1) 定时兜底：每小时自动检测并同步一次（无需任何外部配置）
  schedule:
    - cron: '17 * * * *'
  # 2) 手动：Actions → sync-from-dockerhub → Run workflow
  workflow_dispatch:
  # 3) 全自动即时：Docker Hub webhook → Cloudflare Worker → repository_dispatch
  repository_dispatch:
    types: [dockerhub-sync]

permissions:
  contents: read
  packages: write

env:
  SRC:  wuenci514/ysp-live
  GHCR: ghcr.io/wuenci666/ysp-live
  CNB:  docker.cnb.cool/wuenciteam/ysp-live-docker

jobs:
  # 第一阶段：从 Docker Hub 拉全部标签，推送到 ghcr（GITHUB_TOKEN 自带 packages:write）
  sync-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Login Docker Hub (避免 GitHub runner 拉取限流；缺 token 时回退匿名拉取)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取 Docker Hub 全部标签并镜像到 ghcr
        run: |
          set -e
          TAGS=$(curl -fsSL "https://hub.docker.com/v2/repositories/${SRC}/tags?page_size=100" | jq -r '.results[].name')
          echo "Docker Hub 标签：$TAGS"
          for TAG in $TAGS; do
            echo "==> [$TAG] pull & push ghcr"
            docker pull "$SRC:$TAG"
            docker tag  "$SRC:$TAG" "$GHCR:$TAG"
            docker push "$GHCR:$TAG"
          done
          # GitHub Packages 的横幅版本以最后推送的标签为准；
          # 因此先把 latest 再推一次，最后把 v9.5-G 推一次，让页面横幅显示为 v9.5-G。
          echo "==> [latest] re-push as the 'latest' pointer"
          docker pull "$SRC:latest" && docker tag "$SRC:latest" "$GHCR:latest" && docker push "$GHCR:latest"
          echo "==> [v9.5-G] re-push last so GitHub Packages banner shows v9.5-G"
          docker pull "$SRC:v9.5-G" && docker tag "$SRC:v9.5-G" "$GHCR:v9.5-G" && docker push "$GHCR:v9.5-G"
          echo "✅ ghcr 镜像完成"

  # 第二阶段：把相同标签推送到 cnb（需要 CNB_TOKEN secret）
  sync-cnb:
    needs: sync-ghcr
    runs-on: ubuntu-latest
    steps:
      - name: Login Docker Hub
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login CNB Docker Registry
        uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}

      - name: 拉取 Docker Hub 全部标签并镜像到 cnb
        run: |
          set -e
          TAGS=$(curl -fsSL "https://hub.docker.com/v2/repositories/${SRC}/tags?page_size=100" | jq -r '.results[].name')
          for TAG in $TAGS; do
            echo "==> [$TAG] pull & push cnb"
            docker pull "$SRC:$TAG"
            docker tag  "$SRC:$TAG" "$CNB:$TAG"
            docker push "$CNB:$TAG"
          done
          # 与 ghcr 保持一致：latest 与 v9.5-G 最后推送，让横幅显示为 v9.5-G。
          echo "==> [latest] re-push as the 'latest' pointer"
          docker pull "$SRC:latest" && docker tag "$SRC:latest" "$CNB:latest" && docker push "$CNB:latest"
          echo "==> [v9.5-G] re-push last so CNB banner shows v9.5-G"
          docker pull "$SRC:v9.5-G" && docker tag "$SRC:v9.5-G" "$CNB:v9.5-G" && docker push "$CNB:v9.5-G"
          echo "✅ cnb 镜像完成"
