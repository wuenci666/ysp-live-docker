# ysp-live v5.1 — 端口已固定：宿主 8767（主程序）+ 8766（设备协议引擎）
# 注意：v5.1 状态文件写在 /app 内部，无法单独挂载持久化，重建容器会重新注册设备（不影响使用）
name: ysp-live-v51

services:
  ysp-live:
    image: ysp-live:v5.1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ysp-live-v5.1
    restart: unless-stopped
    ports:
      - "8767:8767"   # 主服务：首页 / all.m3u / 64 路直播
      - "8766:8766"   # 设备协议引擎（进程内线程）
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
