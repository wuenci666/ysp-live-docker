# ysp-live v6.2 — 单端口版，端口已固定：宿主 8767
# 注意：v6.2 状态文件写在 /app 内部，无法单独挂载持久化，重建容器会重新注册设备（不影响使用）
name: ysp-live-v62

services:
  ysp-live:
    image: ysp-live:v6.2
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ysp-live-v6.2
    restart: unless-stopped
    ports:
      - "8767:8767"   # 主服务：首页 / all.m3u / 64 路直播
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
