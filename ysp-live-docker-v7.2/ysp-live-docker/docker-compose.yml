# ysp-live v7.2 — 单端口版，端口已固定：宿主 8767
name: ysp-live-v72

services:
  ysp-live:
    image: ysp-live:v7.2
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ysp-live-v7.2
    restart: unless-stopped
    ports:
      - "8767:8767"   # 主服务：首页 / all.m3u / 64 路直播
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - YSP_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data   # 设备身份持久化，重建容器不丢认证
