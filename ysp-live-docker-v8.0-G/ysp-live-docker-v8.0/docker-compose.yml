name: ysp-live-v80g

services:
  ysp-live:
    image: ysp-live:v8.0-G
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ysp-live-v8.0-G
    restart: unless-stopped
    ports:
      - "8767:8767"
    # network_mode: host  # NAS/软路由如需 host 模式，可取消此行注释（同时将上方的 ports 两行注释掉）
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
