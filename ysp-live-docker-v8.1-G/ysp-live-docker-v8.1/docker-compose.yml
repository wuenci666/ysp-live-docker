name: ysp-live-v81g

services:
  ysp-live:
    image: ysp-live:v8.1-G
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ysp-live-v8.1-G
    restart: unless-stopped
    ports:
      - "8767:8767"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - YSP_DATA_DIR=/app/data
