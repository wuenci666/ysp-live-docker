name: ysp-live-v95g

services:
  ysp-live:
    image: ysp-live:v9.5-G
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ysp-live-v95g
    restart: unless-stopped
    ports:
      - "8767:8767"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - YSP_DATA_DIR=/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
